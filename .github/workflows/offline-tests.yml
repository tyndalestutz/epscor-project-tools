name: Offline regression tests

on:
  pull_request:
  push:
    branches: [main, 'ci/**']

permissions:
  contents: read

concurrency:
  group: offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python 3.10 / offline regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-offline.txt
      - name: Install headless Qt and TeX prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 texlive-latex-base texlive-latex-recommended texlive-latex-extra lmodern
      - name: Install software-only Python dependencies
        run: python -m pip install -r requirements-offline.txt
      - name: Run all offline regression suites
        run: bash scripts/test-offline.sh
